name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build single-file HTML from src/
        run: node tools/build.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The artifact service can take a moment to make the new artifact
      # visible to deploy-pages; avoid a race on fast uploads.
      - name: Wait for artifact registration
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
